---
- name: Deploy KUKA Tool Service pilot
  hosts: fleet_host
  gather_facts: false
  become: true
  serial: 1

  pre_tasks:
    - name: Restrict deployment to Fleetlord
      ansible.builtin.assert:
        that:
          - inventory_hostname == "fleetlord"
          - ansible_host == "fleetlord.local"
        fail_msg: Refusing to deploy to an unexpected host.

    - name: Require explicit deployment approval and reviewed revision
      ansible.builtin.assert:
        that:
          - kuka_tool_deployment_approved | default(false) | bool
          - kuka_tool_release_revision | default('') is match('^[0-9a-f]{7,40}$')
        fail_msg: >-
          Set kuka_tool_deployment_approved=true and provide the reviewed
          lowercase Git revision as kuka_tool_release_revision.

    - name: Inspect the shared Production Desk users secret
      ansible.builtin.stat:
        path: /srv/sv08/secrets/production-desk/users.json
      register: kuka_tool_users

    - name: Require the protected users secret
      ansible.builtin.assert:
        that:
          - kuka_tool_users.stat.exists
          - kuka_tool_users.stat.isreg
          - not kuka_tool_users.stat.islnk
          - kuka_tool_users.stat.pw_name == "root"
          - kuka_tool_users.stat.gr_name == "root"
          - kuka_tool_users.stat.mode == "0600"
        fail_msg: >-
          KUKA Tool Service requires root-owned mode-0600
          /srv/sv08/secrets/production-desk/users.json.

    - name: Verify Docker daemon access
      ansible.builtin.command:
        argv: [docker, version]
      changed_when: false

    - name: Verify the external service network
      ansible.builtin.command:
        argv: [docker, network, inspect, fleet-services]
      changed_when: false
      register: kuka_tool_network_inspect

    - name: Inspect an existing stack definition
      ansible.builtin.stat:
        path: /opt/stacks/kuka-tool-service/compose.yaml
      register: kuka_tool_existing_compose

    - name: Inspect reserved listener ports
      ansible.builtin.command:
        argv: [ss, -H, -ltn, "sport = :6000 or sport = :6001"]
      changed_when: false
      register: kuka_tool_reserved_ports
      when: not kuka_tool_existing_compose.stat.exists

    - name: Derive occupied service-network addresses
      ansible.builtin.set_fact:
        kuka_tool_occupied_addresses: >-
          {{
            (
              (kuka_tool_network_inspect.stdout | from_json | first).Containers
              | default({})
              | dict2items
              | map(attribute='value.IPv4Address')
              | map('regex_replace', '/.*$', '')
              | list
            )
          }}

    - name: Require unoccupied pilot ports and address
      ansible.builtin.assert:
        that:
          - kuka_tool_reserved_ports.stdout | trim == ''
          - "'172.30.0.23' not in kuka_tool_occupied_addresses"
        fail_msg: >-
          Refusing first deployment because port 6000/6001 or
          fleet-services address 172.30.0.23 is already occupied.
      when: not kuka_tool_existing_compose.stat.exists

  tasks:
    - name: Ensure stack and application-data directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {path: /opt/stacks/kuka-tool-service, mode: "0755"}
        - {path: /opt/stacks/kuka-tool-service/src, mode: "0755"}
        - {path: /srv/sv08/appdata/kuka-tool-service, mode: "0755"}
        - {path: /srv/sv08/appdata/kuka-tool-service/data, mode: "0750"}
        - {path: /srv/sv08/appdata/kuka-tool-service/caddy-data, mode: "0755"}
        - {path: /srv/sv08/appdata/kuka-tool-service/caddy-config, mode: "0755"}

    - name: Install reviewed stack files
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "/opt/stacks/kuka-tool-service/{{ item }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop:
        - Caddyfile
        - Dockerfile
        - README.md
        - compose.yaml
        - pyproject.toml
      register: kuka_tool_stack_files

    - name: Install reviewed application package
      ansible.builtin.copy:
        src: ../src/
        dest: /opt/stacks/kuka-tool-service/src/
        owner: root
        group: root
        mode: preserve
        directory_mode: "0755"
      register: kuka_tool_source_files

    - name: Record the reviewed release revision
      ansible.builtin.copy:
        content: "{{ kuka_tool_release_revision }}\n"
        dest: /opt/stacks/kuka-tool-service/RELEASE
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: kuka_tool_release_marker

    - name: Validate KUKA Tool Service Compose configuration
      ansible.builtin.command:
        argv: [docker, compose, config, --quiet]
        chdir: /opt/stacks/kuka-tool-service
      changed_when: false

    - name: Build and start service after a reviewed source change
      ansible.builtin.command:
        argv: [docker, compose, up, -d, --build]
        chdir: /opt/stacks/kuka-tool-service
      when: >-
        kuka_tool_stack_files.changed
        or kuka_tool_source_files.changed
        or kuka_tool_release_marker.changed
      changed_when: true

    - name: Ensure service is running when reviewed source is unchanged
      ansible.builtin.command:
        argv: [docker, compose, up, -d]
        chdir: /opt/stacks/kuka-tool-service
      when:
        - not kuka_tool_stack_files.changed
        - not kuka_tool_source_files.changed
        - not kuka_tool_release_marker.changed
      changed_when: false

    - name: Wait for authenticated service health
      ansible.builtin.uri:
        url: http://127.0.0.1:6001/healthz
        return_content: true
        status_code: 200
      register: kuka_tool_health
      retries: 12
      delay: 5
      until:
        - kuka_tool_health.json.status | default('') == 'ok'
        - kuka_tool_health.json.authentication_configured | default(false) | bool
        - not kuka_tool_health.json.controller_access | default(true) | bool

    - name: Verify direct HTTP access fails closed outside health
      ansible.builtin.uri:
        url: http://127.0.0.1:6001/login
        return_content: true
        status_code: 426

    - name: Verify the HTTPS login boundary
      ansible.builtin.uri:
        url: https://fleetlord.local:6000/login
        return_content: true
        status_code: 200
        validate_certs: false

    - name: Report prepared pilot state
      ansible.builtin.debug:
        msg:
          release_revision: "{{ kuka_tool_release_revision }}"
          health: "{{ kuka_tool_health.json }}"
          public_url: https://fleetlord.local:6000
          controller_access: false
          robot_acceptance_complete: false
