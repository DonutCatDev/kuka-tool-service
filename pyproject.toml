[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kuka-tool-service"
version = "0.1.0"
description = "Authenticated browser tools for inspecting and transforming KUKA SRC programs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "gunicorn==26.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kuka_tool_service = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
